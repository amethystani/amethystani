name: GitHub Profile Auto-Update

on:
  push:
    branches: [main]
  schedule:
    # Daily at 04:20 UTC — stats refresh
    - cron: "20 4 * * *"
    # Weekly on Monday 06:00 UTC — featured project rotation
    - cron: "0 6 * * 1"
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Generate profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python today.py

      - name: Commit & push updated SVGs
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || git commit -m "🤖 auto-update: stats + featured rotation [skip ci]"
          git push
