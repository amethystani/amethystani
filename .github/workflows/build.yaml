name: GitHub Stats Auto-Update
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"  # Runs daily at 4 AM UTC
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Configure pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update GitHub Stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python today.py
      - name: Commit and Push Changes
        run: |-
          git add .
          git diff
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git commit -m "🤖 Auto-update GitHub stats" -a || echo "No changes to commit"
          git push