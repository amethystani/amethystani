name: GitHub Profile Auto-Update

on:
  push:
    branches: [main]
  schedule:
    # Daily at 04:20 UTC — stats refresh
    - cron: "20 4 * * *"
    # Weekly on Monday 06:00 UTC — featured project rotation
    - cron: "0 6 * * 1"
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Setup Node.js for poker animation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install poker engine and build the browser table
        run: |
          npm ci --prefix poker
          npm run --prefix poker build
          npm run --prefix poker generate
          npm run --prefix poker package

      - name: Generate profile SVGs
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: python today.py

      - name: Commit & push updated SVGs
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git add dark_mode.svg light_mode.svg cache/ assets/the-long-game.svg poker/app.bundle.js
          git diff --cached --quiet || git commit -m "🤖 auto-update: stats + featured rotation [skip ci]"
          git pull --rebase origin main
          git push

      - name: Publish profile site and live table to GitHub Pages
        run: |
          git fetch origin gh-pages
          POKER_SITE_DIR="$(mktemp -d /tmp/poker-pages.XXXXXX)"
          git worktree add --detach "$POKER_SITE_DIR" origin/gh-pages
          cp -R poker/site-dist/. "$POKER_SITE_DIR/"
          git -C "$POKER_SITE_DIR" config user.email "action@github.com"
          git -C "$POKER_SITE_DIR" config user.name "GitHub Actions"
          git -C "$POKER_SITE_DIR" add -A
          if ! git -C "$POKER_SITE_DIR" diff --cached --quiet; then
            git -C "$POKER_SITE_DIR" commit -m "🤖 deploy poker table and profile site [skip ci]"
            git -C "$POKER_SITE_DIR" push origin HEAD:gh-pages
          fi
          git worktree remove --force "$POKER_SITE_DIR"
