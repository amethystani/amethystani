name: Profile and Poker Table Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: poker/app/pnpm-lock.yaml

      - name: Generate a fresh README replay from real poker hands
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix poker
          npm --prefix poker run generate
          node -e 'const fs=require("node:fs"); const path="readme.md"; const text=fs.readFileSync(path,"utf8"); fs.writeFileSync(path,text.replace(/assets\/live-poker-simulation\.png(?:\?v=[^" ]*)?/g, `assets/live-poker-simulation.png?v=${process.env.GITHUB_RUN_ID}`));'
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add readme.md assets/live-poker-simulation.png assets/the-long-game.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh engine-generated poker replay [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Install, test, build, and package the full poker app
        run: |
          cd poker/app
          pnpm install --frozen-lockfile
          pnpm test:all
          pnpm build
          cd ../..
          node poker/package-site.mjs

      - name: Publish profile site and live table to GitHub Pages
        run: |
          git fetch origin gh-pages
          POKER_SITE_DIR="$(mktemp -d /tmp/poker-pages.XXXXXX)"
          git worktree add --detach "$POKER_SITE_DIR" origin/gh-pages
          find "$POKER_SITE_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R poker/site-dist/. "$POKER_SITE_DIR/"
          git -C "$POKER_SITE_DIR" config user.email "action@github.com"
          git -C "$POKER_SITE_DIR" config user.name "GitHub Actions"
          git -C "$POKER_SITE_DIR" add -A
          if ! git -C "$POKER_SITE_DIR" diff --cached --quiet; then
            git -C "$POKER_SITE_DIR" commit -m "🤖 deploy poker table and profile site [skip ci]"
            git -C "$POKER_SITE_DIR" push origin HEAD:gh-pages
          fi
          git worktree remove --force "$POKER_SITE_DIR"
