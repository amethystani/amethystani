<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img"><title>EVIRAG-Bench. Conflicting evidence. Kept apart, not averaged away.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.spin{transform-origin:900px 290px;animation:spin 45s linear infinite}.rev{animation-direction:reverse}.signal{stroke-dasharray:3 24;animation:signal 12s linear infinite}.blink{animation:blink 1.5s steps(2,end) infinite}.reveal{animation:reveal 8s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-324}}@keyframes blink{50%{opacity:0}}@keyframes reveal{0%,15%{opacity:.25}40%,80%{opacity:1}100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.spin,.signal,.blink,.reveal{animation:none}}</style><rect x="1" y="1" width="578" height="308" rx="10" fill="#141511" stroke="#3b3d32"/><text x="26" y="39" fill="#e2f896" font-size="13" class="mono">01 / SCIENTIFIC RETRIEVAL</text><text x="551" y="41" text-anchor="end" fill="#e2f896" font-size="25">↗</text><text x="26" y="102" fill="#eeeee4" font-size="38" font-weight="700" letter-spacing="-1.5">EVIRAG-Bench</text><text x="26" y="144" fill="#a9ac9e" font-size="18">Conflicting evidence.</text><text x="26" y="170" fill="#a9ac9e" font-size="18">Kept apart, not averaged away.</text><path d="M26 207H554" stroke="#34372c"/><path d="M28 234H135L180 226H290L335 239H552" fill="none" stroke="#e2f896" opacity=".5"/><path d="M28 234H135L180 226H290L335 239H552" fill="none" stroke="#e2f896" stroke-width="2" class="signal"/><path d="M28 256H135L180 248H290L335 261H552" fill="none" stroke="#e2f896" opacity=".5"/><path d="M28 256H135L180 248H290L335 261H552" fill="none" stroke="#e2f896" stroke-width="2" class="signal"/><path d="M28 278H135L180 270H290L335 283H552" fill="none" stroke="#e2f896" opacity=".5"/><path d="M28 278H135L180 270H290L335 283H552" fill="none" stroke="#e2f896" stroke-width="2" class="signal"/></svg>