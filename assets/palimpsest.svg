<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img"><title>Palimpsest. What the tokeniser deletes, the metric cannot judge.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.spin{transform-origin:900px 290px;animation:spin 45s linear infinite}.rev{animation-direction:reverse}.signal{stroke-dasharray:3 24;animation:signal 12s linear infinite}.blink{animation:blink 1.5s steps(2,end) infinite}.reveal{animation:reveal 8s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-324}}@keyframes blink{50%{opacity:0}}@keyframes reveal{0%,15%{opacity:.25}40%,80%{opacity:1}100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.spin,.signal,.blink,.reveal{animation:none}}</style><rect x="1" y="1" width="578" height="308" rx="10" fill="#141511" stroke="#3b3d32"/><text x="26" y="39" fill="#bcb8ff" font-size="13" class="mono">03 / TRANSLATION EVALUATION</text><text x="551" y="41" text-anchor="end" fill="#bcb8ff" font-size="25">↗</text><text x="26" y="102" fill="#eeeee4" font-size="38" font-weight="700" letter-spacing="-1.5">Palimpsest</text><text x="26" y="144" fill="#a9ac9e" font-size="18">What the tokeniser deletes,</text><text x="26" y="170" fill="#a9ac9e" font-size="18">the metric cannot judge.</text><path d="M26 207H554" stroke="#34372c"/><text x="28" y="257" fill="#bcb8ff" font-size="21" class="mono">TEXT → TOKENS → [ ? ]</text><path d="M28 275H550" stroke="#bcb8ff" opacity=".4" stroke-dasharray="8 6" class="signal"/></svg>