<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Animesh Mishra — ML/NLP Researcher</title>
  <desc id="desc">Research and building cool stuff. Evaluation, retrieval, and scientific AI. New Delhi. Open to research roles. Animated evidence streams remain separate rather than collapsing into a single signal.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111714"/><stop offset="1" stop-color="#080b0a"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#c7ff87" stop-opacity="0"/><stop offset=".45" stop-color="#c7ff87"/><stop offset="1" stop-color="#c7ff87" stop-opacity=".12"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e4edde" stroke-opacity=".035"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="478" rx="22"/></clipPath>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace;letter-spacing:2px}.flow{stroke-dasharray:8 20;animation:flow 14s linear infinite}.flow2{animation-direction:reverse;animation-duration:19s}.pulse{animation:pulse 5s ease-in-out infinite}.cursor{animation:blink 1.6s steps(2,end) infinite}
    @keyframes flow{to{stroke-dashoffset:-336}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="480" fill="url(#surface)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>
    <g fill="none" stroke-width="1.5">
      <path d="M670 380C760 380 710 88 835 88S955 345 1230 105" stroke="#c7ff87" stroke-opacity=".16"/>
      <path d="M670 380C760 380 710 88 835 88S955 345 1230 105" stroke="url(#line)" class="flow"/>
      <path d="M700 412C840 412 745 140 885 140S970 365 1230 170" stroke="#d3dbe4" stroke-opacity=".13"/>
      <path d="M700 412C840 412 745 140 885 140S970 365 1230 170" stroke="#b6cdd5" stroke-opacity=".65" class="flow flow2"/>
      <path d="M740 450C900 450 790 195 930 195S1030 420 1240 245" stroke="#c7ff87" stroke-opacity=".14"/>
      <path d="M740 450C900 450 790 195 930 195S1030 420 1240 245" stroke="url(#line)" class="flow"/>
    </g>
    <circle cx="835" cy="88" r="5" fill="#c7ff87" class="pulse"/>
    <circle cx="885" cy="140" r="4" fill="#b6cdd5" class="pulse"/>
    <circle cx="930" cy="195" r="4" fill="#c7ff87" class="pulse"/>
    <text x="52" y="54" fill="#c7ff87" font-size="13" class="mono">AM / RESEARCH &amp; ENGINEERING</text>
    <text x="1148" y="54" fill="#98a399" font-size="12" text-anchor="end" class="mono">NEW DELHI, INDIA</text>
    <text x="48" y="150" fill="#f2f3e9" font-size="76" font-weight="700" letter-spacing="-4">Animesh Mishra<tspan fill="#c7ff87">.</tspan></text>
    <text x="52" y="193" fill="#a5b1a6" font-size="23">ML/NLP Researcher</text>
    <text x="49" y="271" fill="#f2f3e9" font-size="40" letter-spacing="-1.4">Research and</text>
    <text x="49" y="318" fill="#c7ff87" font-size="40" letter-spacing="-1.4">building cool stuff.</text>
    <text x="52" y="364" fill="#a5b1a6" font-size="16">Evaluation · Retrieval · Scientific AI</text>
    <path d="M52 407H1148" stroke="#2b352c"/>
    <text x="52" y="444" fill="#c7ff87" font-size="12" class="mono">OPEN TO RESEARCH ROLES</text>
    <text x="1148" y="444" fill="#a5b1a6" font-size="12" text-anchor="end" class="mono">amethystani / <tspan class="cursor">_</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="479" rx="22" fill="none" stroke="#303c31"/>
</svg>
