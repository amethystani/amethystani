<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="94" viewBox="0 0 1200 94" role="img"><title>Research you can run. Selected work.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.spin{transform-origin:900px 290px;animation:spin 45s linear infinite}.rev{animation-direction:reverse}.signal{stroke-dasharray:3 24;animation:signal 12s linear infinite}.blink{animation:blink 1.5s steps(2,end) infinite}.reveal{animation:reveal 8s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-324}}@keyframes blink{50%{opacity:0}}@keyframes reveal{0%,15%{opacity:.25}40%,80%{opacity:1}100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.spin,.signal,.blink,.reveal{animation:none}}</style><rect width="1200" height="94" fill="#111210" rx="8"/><text x="28" y="61" fill="#eeeede" font-size="35" font-weight="700" letter-spacing="-1">RESEARCH YOU CAN RUN.</text><text x="1172" y="56" text-anchor="end" fill="#ff7a42" font-size="13" class="mono">SELECTED WORK / 01—04</text></svg>