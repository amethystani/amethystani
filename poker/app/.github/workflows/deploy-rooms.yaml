name: Deploy the rooms Worker

# The multiplayer room server (rooms/, docs/multiplayer.md): a Worker with two
# Durable Object classes, deployed beside the Pages site rather than in it.
#
# Runs on a push to main that touches the server or the game code it bundles,
# and by hand. It does nothing until the repo variable ROOMS_ENABLED is
# `true`, which is set once, as the last step of the runbook in
# docs/multiplayer.md (Workers Paid, the secrets, the custom domain). Before
# that a push here is a skipped job, not a failed deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'rooms/**'
      - 'src/lib/multiplayer/**'
      - 'src/lib/poker/**'
      - 'src/lib/membership/entitlement.ts'
      - 'src/config/cast.ts'
      - 'src/config/venues.ts'
      - 'src/config/blinds.ts'
  workflow_dispatch:

concurrency:
  group: deploy-rooms
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.ROOMS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The rules the server runs are the ones these test. A red engine never
      # reaches a table people are sitting at.
      - name: Check types
        run: pnpm test:types

      - name: Run the multiplayer and engine tests
        run: pnpm ava tests/multiplayer*.test.ts tests/engine.test.ts tests/pots.test.ts

      # Secrets live on the Worker itself (wrangler secret put), never here.
      # Its own token, not the Pages one: deploying a Worker with Durable
      # Objects and a custom domain needs Workers permissions the Pages token
      # was never given (docs/multiplayer.md, runbook).
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm rooms:deploy
