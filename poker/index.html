<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110e">
  <meta name="description" content="The Long Game — a live, endless Texas Hold’em table. Four seats, real poker rules, play chips only.">
  <title>THE LONG GAME — LIVE HOLD’EM</title>
  <link rel="icon" href="../assets/cards/AS.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-label="The Long Game live Texas Hold’em table">
    <div class="hud">
      <div class="identity"><span class="signal" aria-hidden="true"></span><span>THE LONG GAME</span><i>·</i><span id="hand-id">HAND 001</span></div>
      <div class="controls"><span id="round-label">PRE-FLOP · BLINDS 5 / 10</span><button id="speed" class="speed" type="button" title="Toggle table pace">PACE <b>1×</b></button></div>
    </div>

    <section class="table-wrap" aria-label="Live poker table">
      <div class="table-rim">
        <div class="table-felt">
          <div class="felt-grain" aria-hidden="true"></div>
          <div class="pot"><small>POT</small><b id="pot">—</b><span>CHIPS</span></div>
          <div id="board" class="board" aria-label="Community cards"></div>
          <div id="seats" class="seats"></div>
          <div class="hand-toast" id="toast" aria-live="polite">SHUFFLING THE DECK</div>
          <div class="dealer-track" id="dealer-track"></div>
        </div>
      </div>
      <div class="table-under"><span><b class="dot"></b> AUTOMATIC DEAL</span><span>PLAY CHIPS ONLY <i>·</i> NO REAL MONEY</span></div>
    </section>

    <div class="feedline"><span class="feed-label">TABLE FEED</span><div id="feed" class="feed" aria-live="polite"></div></div>
  </main>
  <script type="module" src="app.bundle.js"></script>
</body>
</html>
